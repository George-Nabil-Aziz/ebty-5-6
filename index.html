<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>
    <link id="favicon" rel="icon" type="image/png" href="assets/img/logo.png" />
    <link rel="stylesheet" href="css/style.css?v=8" />
  </head>
  <body>
    <div class="app">
      <div class="app-header" dir="ltr">
        <img id="logo" src="assets/img/logo.png" alt="Quiz Logo" class="logo" />
        <div class="header-toggles">
          <!-- بيختفي أثناء الامتحان عشان حد ميدوسش عليه بالغلط ويخرج -->
          <a id="admin-link" class="toggle-btn" href="pages/admin.html">🔑</a>
          <button id="lang-toggle" class="toggle-btn" type="button">EN</button>
          <button id="theme-toggle" class="toggle-btn" type="button">🌙</button>
        </div>
      </div>

      <!-- شاشة البداية -->
      <section id="start-screen" class="screen">
        <h1 id="app-title">الكويز</h1>
        <p id="quiz-notice" class="quiz-notice"></p>
        <p id="last-score" class="last-score"></p>

        <div class="name-field">
          <label id="student-name-label" for="student-name">اسمك</label>
          <input
            id="student-name"
            type="text"
            maxlength="60"
            autocomplete="name"
            dir="auto"
          />
        </div>

        <button id="start-btn" class="btn primary">ابدأ الكويز</button>

        <!-- أدوات التجربة: بتظهر للأدمن المسجّل دخول بس -->
        <div class="debug-tools">
          <button id="debug-all-btn" class="btn debug-btn" type="button">
            🧪 اعرض كل الأسئلة
          </button>
        </div>
      </section>

      <!-- شاشة السؤال -->
      <section id="quiz-screen" class="screen hidden">
        <div class="progress">
          <span id="progress-text"></span>
          <span id="timer" class="timer">15:00</span>
        </div>

        <h2 id="question-text" dir="rtl"></h2>
        <div id="answer-area" dir="rtl"></div>
        <button id="next-btn" class="btn primary">التالي</button>

        <!-- ===== أدوات التجربة: تحت خالص، وبتظهر للأدمن المسجّل دخول بس ===== -->

        <!-- شريط بيبين كل سؤال جاوبته صح ولا غلط -->
        <div id="debug-answers-bar" class="debug-answers-bar"></div>

        <div class="debug-tools debug-nav">
          <button id="debug-prev-btn" class="btn debug-btn" type="button">
            ◀️ السابق
          </button>
          <button id="debug-next-btn" class="btn debug-btn" type="button">
            التالي ▶️
          </button>
        </div>

        <!-- النقل لسؤال معيّن. صف الـ id بيظهر في وضع "كل الأسئلة" بس،
             لأن الرقم الثابت ملوش لازمة جوه امتحان عادي. -->
        <div class="debug-tools debug-goto">
          <div class="debug-goto-row">
            <label for="debug-position-input">السؤال رقم</label>
            <input
              id="debug-position-input"
              type="text"
              inputmode="numeric"
              placeholder="مثال 5"
            />
            <button id="debug-position-btn" class="btn debug-btn" type="button">
              🧪 روح
            </button>
          </div>
          <div id="debug-goto-id-row" class="debug-goto-row">
            <label for="debug-question-id-input">id السؤال رقم</label>
            <input
              id="debug-question-id-input"
              type="text"
              inputmode="numeric"
              placeholder="مثال 2_1031"
            />
            <button id="debug-goto-btn" class="btn debug-btn" type="button">
              🧪 روح
            </button>
          </div>
        </div>

        <!-- إنهاء الامتحان تحت خالص وبعيد عن زراير "التالي"،
             عشان محدش يدوسه وهو قاصد يكمّل -->
        <button id="finish-btn" class="btn btn-quiet" type="button">
          إنهاء الامتحان
        </button>
      </section>

      <!-- شاشة النتيجة -->
      <section id="result-screen" class="screen hidden">
        <h1 id="result-title">النتيجة</h1>
        <p id="score-text" class="score-text"></p>
        <div id="review-list" class="review-list"></div>
        <button id="restart-btn" class="btn primary">إعادة الكويز</button>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js?v=8"></script>
    <script src="js/lib/quiz-core.js?v=8"></script>
    <script src="js/lib/coptic-markup.js?v=8"></script>
    <script src="js/db.js?v=8"></script>
    <script src="js/script.js?v=8"></script>
  </body>
</html>
