<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>
    <link id="favicon" rel="icon" type="image/png" href="logo.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <div class="app-header" dir="ltr">
        <img id="logo" src="logo.png" alt="Quiz Logo" class="logo" />
        <div class="header-toggles">
          <button id="lang-toggle" class="toggle-btn" type="button">EN</button>
          <button id="theme-toggle" class="toggle-btn" type="button">🌙</button>
        </div>
      </div>

      <!-- شاشة البداية -->
      <section id="start-screen" class="screen">
        <h1 id="app-title">الكويز</h1>
        <p id="quiz-notice" class="quiz-notice"></p>
        <p id="last-score" class="last-score"></p>
        <button id="start-btn" class="btn primary">ابدأ الكويز</button>

        <!-- TEMP: أدوات تجربة بس، هتتشال قبل الإطلاق -->
        <div class="debug-tools">
          <button id="debug-all-btn" class="btn debug-btn" type="button">
            🧪 اعرض كل الأسئلة
          </button>
          <div class="debug-goto">
            <input
              id="debug-question-id-input"
              type="text"
              inputmode="numeric"
              placeholder="رقم السؤال (مثال 2_1031)"
            />
            <button id="debug-goto-btn" class="btn debug-btn" type="button">
              🧪 روح للسؤال
            </button>
          </div>
        </div>
      </section>

      <!-- شاشة السؤال -->
      <section id="quiz-screen" class="screen hidden">
        <div class="progress">
          <span id="progress-text"></span>
          <span id="timer" class="timer">15:00</span>
        </div>

        <!-- TEMP: شريط تجربة بيبين كل سؤال جاوبته صح ولا غلط -->
        <div id="debug-answers-bar" class="debug-answers-bar"></div>

        <!-- TEMP: أدوات تجربة بس، هتتشال قبل الإطلاق -->
        <div class="debug-tools debug-nav">
          <button id="debug-prev-btn" class="btn debug-btn" type="button">
            ◀️ السابق
          </button>
          <button id="debug-next-btn" class="btn debug-btn" type="button">
            التالي ▶️
          </button>
        </div>
        <h2 id="question-text" dir="rtl"></h2>
        <div id="answer-area" dir="rtl"></div>
        <button id="next-btn" class="btn primary">التالي</button>
      </section>

      <!-- شاشة النتيجة -->
      <section id="result-screen" class="screen hidden">
        <h1 id="result-title">النتيجة</h1>
        <p id="score-text" class="score-text"></p>
        <div id="review-list" class="review-list"></div>
        <button id="restart-btn" class="btn primary">إعادة الكويز</button>
      </section>
    </div>

    <script src="questions.js"></script>
    <script src="script.js"></script>
  </body>
</html>
