<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نقل الأسئلة للداتابيز</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 24px;
        line-height: 1.9;
        max-width: 720px;
        margin: 0 auto;
      }
      input,
      button {
        font: inherit;
        padding: 9px 12px;
        margin: 4px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
      }
      input { width: 280px; display: block; }
      button { cursor: pointer; background: #2563eb; color: #fff; border-color: #2563eb; }
      button:disabled { opacity: 0.6; cursor: default; }
      #log {
        background: #f4f4f4;
        padding: 14px;
        border-radius: 8px;
        margin-top: 18px;
        min-height: 40px;
      }
      .ok { color: #0a7d32; }
      .bad { color: #c02626; font-weight: bold; }
      code { background: #ececec; padding: 2px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>نقل الأسئلة للداتابيز</h1>
    <p>
      أداة لمرة واحدة. بتقرا الأسئلة من <code>js/questions.js</code> وتحطها في
      Supabase بنفس الـ id ونفس الصعوبة. لو شغلتها تاني بتحدّث الموجود بدل ما
      تكرره، فمفيش ضرر من إعادة التشغيل.
    </p>

    <input id="email" type="email" placeholder="إيميل الأدمن" autocomplete="username" />
    <input id="password" type="password" placeholder="الباسورد" autocomplete="current-password" />
    <button id="run" type="button">سجّل دخول وانقل الأسئلة</button>

    <div id="log"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/lib/quiz-core.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/questions.js"></script>
    <script>
      const logEl = document.getElementById("log");
      const runBtn = document.getElementById("run");

      function log(msg, cls) {
        const line = document.createElement("div");
        if (cls) line.className = cls;
        line.textContent = msg;
        logEl.appendChild(line);
      }

      // المجموعة بتحدد الصعوبة — نفس المنطق اللي كان في questions.js
      const GROUPS = [
        ["easy", EASY_QUESTIONS],
        ["medium", MEDIUM_QUESTIONS],
        ["hard", HARD_QUESTIONS],
      ];

      async function countRows(difficulty) {
        let query = db.from("questions").select("*", { count: "exact", head: true });
        if (difficulty) query = query.eq("difficulty", difficulty);
        const { count, error } = await query;
        if (error) throw error;
        return count;
      }

      runBtn.addEventListener("click", async () => {
        logEl.innerHTML = "";
        runBtn.disabled = true;
        try {
          const { error: authError } = await db.auth.signInWithPassword({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          });
          if (authError) throw authError;
          log("تم تسجيل الدخول.", "ok");

          const rows = GROUPS.flatMap(([difficulty, list]) =>
            list.map((q) => questionToRow(q, difficulty)),
          );
          log(`جاهز ينقل ${rows.length} سؤال...`);

          const { error } = await db
            .from("questions")
            .upsert(rows, { onConflict: "id" });
          if (error) throw error;
          log("تم النقل. جاري التحقق...", "ok");

          const total = await countRows(null);
          log(
            `العدد الكلي في الداتابيز: ${total} — في الملف: ${rows.length}`,
            total >= rows.length ? "ok" : "bad",
          );

          for (const [difficulty, list] of GROUPS) {
            const count = await countRows(difficulty);
            log(
              `${difficulty}: الداتابيز ${count} — الملف ${list.length}`,
              count >= list.length ? "ok" : "bad",
            );
          }

          // تحقق إن ترميز الحروف القبطية اتخزن كما هو
          const { data: sample, error: sampleError } = await db
            .from("questions")
            .select("id, question")
            .like("question", "%{{%")
            .limit(3);
          if (sampleError) throw sampleError;
          log(`أسئلة فيها ترميز {{ }}: ${sample.length} عينة`, "ok");
          sample.forEach((s) => log(`  ${formatQuestionId(s.id)}: ${s.question}`));

          log("خلص. راجع السطور فوق وتأكد إن كلها خضرا.", "ok");
        } catch (e) {
          log("فشل: " + (e.message || e), "bad");
        } finally {
          runBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
